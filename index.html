<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eric Xu</title>
  <meta name="description" content="Eric Xu — CS & Applied Math at Brown University. Software engineer and machine learning researcher.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==========================================================
       All personal content lives in this file; nothing is generated.
       Search for "EDIT" to find each field.
       ========================================================== -->

  <div class="page">

    <!-- Nav row — Nous-style uppercase serif links above the rule. EDIT hrefs as needed. -->
    <nav class="nav" aria-label="Links">
      <a class="nav__link nav__link--current" href="/" aria-current="page">Home</a>
      <a class="nav__link" href="https://github.com/ericxu88" target="_blank" rel="noopener">GitHub</a>
      <a class="nav__link" href="https://linkedin.com/in/ericxu88" target="_blank" rel="noopener">LinkedIn</a>
    </nav>

    <!-- The card — Fauzan-style business-card formatting between two dashed rules. -->
    <main class="card" aria-label="Business card">

      <header class="card__top">
        <!-- EDIT: phone (top-left) -->
        <p class="card__phone"><a href="tel:+16784394668">678 439 4668</a></p>

        <!-- EDIT: school (top-right) -->
        <div class="card__school">
          <p class="card__school-name">Brown University</p>
          <p class="card__school-sub">
            <span class="group">
              <span class="item">CS–Applied Mathematics</span>
              <span class="sep" aria-hidden="true">|</span>
              <span class="item">GPA: 4.0/4.0</span>
            </span>
            <span class="sep sep--group" aria-hidden="true">|</span>
            <span class="group"><span class="item">May 2028</span></span>
          </p>
        </div>
      </header>

      <section class="card__center">
        <!-- EDIT: name + email -->
        <h1 class="card__name">Eric Xu</h1>
        <p class="card__email"><a href="mailto:eric.xu1798@gmail.com">eric.xu1798@gmail.com</a></p>
      </section>

      <footer class="card__bottom">
        <!-- EDIT: location / role / research / resume -->
        <!-- Items are grouped in pairs so the line breaks cleanly: one row on
             desktop, two rows on tablets, one item per row on phones. -->
        <p class="card__line">
          <span class="group">
            <span class="item">Providence, RI <span class="slash">/</span> Atlanta, GA</span>
            <span class="sep" aria-hidden="true">|</span>
            <span class="item">SWE Intern at Capital One</span>
          </span>
          <span class="sep sep--group" aria-hidden="true">|</span>
          <span class="group">
            <span class="item">ML Researcher at Brown</span>
            <span class="sep" aria-hidden="true">|</span>
            <a class="item card__resume" href="resume.pdf" target="_blank" rel="noopener">Resume</a>
          </span>
        </p>
      </footer>

    </main>

    <!-- Nous-style output stamp. Purely decorative; seed regenerates on each load. -->
    <aside class="stamp" aria-hidden="true">
      <svg class="stamp__glyph" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9.5"/>
        <ellipse cx="12" cy="12" rx="4" ry="9.5"/>
        <line x1="2.5" y1="12" x2="21.5" y2="12"/>
        <path d="M4.2 7.2h15.6M4.2 16.8h15.6"/>
      </svg>
      <span class="stamp__text">
        <span>OUTPUT 01</span>
        <span>SEED: <span id="seed">0000000000</span></span>
      </span>
    </aside>

  </div>

  <script>
    // Random 10-digit seed, a nod to the "OUTPUT / SEED" labels on nousresearch.com.
    (function () {
      var el = document.getElementById('seed');
      if (!el) return;
      var n = '';
      for (var i = 0; i < 10; i++) n += Math.floor(Math.random() * 10);
      el.textContent = n.replace(/^0/, '1');
    })();
  </script>
</body>
</html>
